# Helper function to get config value
# Args:
#   $1: Check ID (e.g., A1)
#   $2: Field name (gate, category, label, type, severity, function, args)
get_config() {
  local check_id="$1"
  local field="$2"
  echo "${CHECK_CONFIG[${check_id}_${field}]}"
}
