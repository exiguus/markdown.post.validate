#!/bin/bash

# Check Configuration for Blog Post Quality Gate Validator
# This file contains the declarative configuration for all validation checks.
# Sourced by check.sh to populate CHECK_CONFIG and CHECK_IDS arrays.
#
# Check configuration format:
#   key: Check ID (A1, A2, etc.)
#   gate: Gate group (A, B, or C)
#   category: Display category (Format, Structure, Links, etc.)
#   label: Full description for display
#   type: automated or manual
#   severity: error (fail on failure) or warning (warn on failure)
#   function: Name of validation function to call
#   args: Arguments to pass to the validation function (space-separated)

# Declare associative array for check configuration
declare -A CHECK_CONFIG

# Gate A: Blocking Failures
CHECK_CONFIG[A1_gate]="A"
CHECK_CONFIG[A1_category]="Format"
CHECK_CONFIG[A1_label]="Required frontmatter fields and format validation"
CHECK_CONFIG[A1_type]="automated"
CHECK_CONFIG[A1_severity]="error"
CHECK_CONFIG[A1_function]="validate_frontmatter validate_frontmatter_format validate_toml_delimiter"
CHECK_CONFIG[A1_args]="content verbose"

CHECK_CONFIG[A2_gate]="A"
CHECK_CONFIG[A2_category]="Fact-Checking"
CHECK_CONFIG[A2_label]="Source verification"
CHECK_CONFIG[A2_type]="manual"
